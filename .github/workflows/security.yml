name: Security Analysis Workflow

on:
  workflow_call:
    outputs:
      codeql_status:
        description: "CodeQL security analysis status"
        value: ${{ jobs.codeql.outputs.status }}
      security_status:
        description: "Security scan overall status"  
        value: ${{ jobs.security.outputs.status }}

jobs:
  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write
    outputs:
      status: ${{ steps.result.outputs.status }}
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: true
      - name: Set Result
        id: result
        run: echo "status=success" >> $GITHUB_OUTPUT

  security:
    name: Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # necessário para upload-sarif (anotações no PR)
      pull-requests: read
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ./sbom.spdx.json
      - name: Gitleaks Security Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
      - name: License Scan
        run: |
          echo "=== LICENSE SCAN ===" > license-scan.log
          find . -name "LICENSE*" -o -name "license*" -o -name "COPYING*" | head -20 >> license-scan.log || true
          echo "=== NPM LICENSE CHECK ===" >> license-scan.log
          if [ -f backend/package.json ]; then (cd backend && npm list --depth=0 2>/dev/null | head -20 >> ../license-scan.log || true); fi
          if [ -f frontend/package.json ]; then (cd frontend && npm list --depth=0 2>/dev/null | head -20 >> ../license-scan.log || true); fi
      - name: Semgrep
        id: semgrep
        run: |
          pip install semgrep --quiet
          semgrep \
            --config p/security-audit \
            --config p/secrets \
            --config p/ci \
            --config p/javascript \
            --config p/typescript \
            --config p/react \
            --sarif \
            --output semgrep.sarif \
            . || true
        continue-on-error: true    # não bloqueia o job se semgrep encontrar findings

      - name: Upload Semgrep SARIF (anotações inline no PR)
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep        # aparece separado do CodeQL na aba Security
      - uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: |
            sbom.spdx.json
            license-scan.log
      - name: Set Result
        id: result
        run: echo "status=success" >> $GITHUB_OUTPUT