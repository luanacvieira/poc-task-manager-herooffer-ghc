name: Orchestrator Pipeline
on:
  push:
    branches: [ master, develop, feature/*, feature/**, release/* ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write
  security-events: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

env:
  NODE_VERSION: '20.x'
  SONAR_PROJECT_KEY: github_poc-task-manager-herooffer-ghc
  SONAR_ORG: luanagithub

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Opção 3: Ignorar push quando já existe PR aberto para o mesmo branch.
  # O evento pull_request (synchronize) assumirá a responsabilidade pelo CI.
  # ──────────────────────────────────────────────────────────────────────────
  skip-check:
    name: 🔍 Skip duplicate push runs
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check for open PR on push event
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            // Non-push events (pull_request, workflow_dispatch, schedule) always run
            if (context.eventName !== 'push') {
              core.setOutput('should_run', 'true');
              return;
            }
            // For push events: check if an open PR already exists for this branch
            const branch = context.ref.replace('refs/heads/', '');
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });
            if (prs.length > 0) {
              core.notice(
                `⏭ Skipping push event: PR #${prs[0].number} is already open for '${branch}'. ` +
                `The pull_request (synchronize) event will handle CI.`
              );
              core.setOutput('should_run', 'false');
            } else {
              core.setOutput('should_run', 'true');
            }

  code-quality:
    name: Code Quality
    needs: [skip-check]
    if: needs.skip-check.outputs.should_run == 'true'
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  testing:
    name: Testing & Coverage
    needs: [code-quality]
    uses: ./.github/workflows/testing.yml
    secrets: inherit

  build:
    name: Build
    needs: [testing]
    uses: ./.github/workflows/build.yml
    secrets: inherit

  security:
    name: Security Analysis
    needs: [build]
    uses: ./.github/workflows/security.yml
    secrets: inherit

  analysis:
    name: Code Analysis
    needs: [build, testing]
    uses: ./.github/workflows/analysis.yml
    secrets: inherit

  package:
    name: Package & Publish
    needs: [build, security, analysis]
    uses: ./.github/workflows/package.yml
    secrets: inherit
    if: |
      github.ref == 'refs/heads/master' || 
      github.ref == 'refs/heads/develop' || 
      github.ref == 'refs/heads/feature/betterrole-with-tests1-aux' ||
      (github.event_name == 'pull_request' && (
        github.event.pull_request.base.ref == 'master' || 
        github.event.pull_request.base.ref == 'develop'
      ))

  deploy:
    name: Deploy
    needs: [package, security, analysis]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
      version: ${{ github.ref_name }}-${{ github.sha }}
    secrets: inherit
    if: |
      github.ref == 'refs/heads/master' || 
      github.ref == 'refs/heads/develop' || 
      github.ref == 'refs/heads/feature/betterrole-with-tests1-aux' ||
      (github.event_name == 'pull_request' && (
        github.event.pull_request.base.ref == 'master' || 
        github.event.pull_request.base.ref == 'develop'
      ))

  finalize:
    name: Finalize & Report
    needs: [skip-check, code-quality, testing, build, security, analysis, package, deploy]
    uses: ./.github/workflows/finalize.yml
    with:
      coverage_avg: ${{ needs.testing.outputs.coverage_avg }}
      diff_pct: ${{ needs.testing.outputs.diff_pct }}
      version: ${{ github.ref_name }}-${{ github.sha }}
    secrets: inherit
    if: always() && needs.skip-check.outputs.should_run == 'true'

  analytics-dashboard:
    name: Analytics Dashboard
    needs: [finalize]
    uses: ./.github/workflows/analytics-dashboard.yml
    secrets: inherit
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'

  badge-smoke-check:
    name: Badge Verification
    needs: [analytics-dashboard]
    uses: ./.github/workflows/badge-smoke-check.yml
    secrets: inherit
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'